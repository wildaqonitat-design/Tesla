<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tesla — Special Collections</title>
    <link rel="stylesheet" href="src/output.css" />
  <script src="tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

    /* Product card hover zoom */
    .product-card:hover .product-img { transform: scale(1.04); }
    .product-img { transition: transform 0.4s ease; }

    /* Wishlist button fade in on hover */
    .wishlist-btn { opacity: 0; transition: opacity 0.2s; }
    .product-card:hover .wishlist-btn { opacity: 1; }
  </style>
</head>
<body class="bg-white text-[#171a20]">

  <!-- ── NAVBAR ── -->
  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-[20px] bg-white/80 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-6 h-12 flex items-center justify-between">
      <!-- Left: Logo + Shop -->
      <div class="flex items-center gap-3">
          <a href="index.html" class="flex-shrink-0">
        <img src="img/tesla-logo-png-20.png" alt="Tesla Logo" width="70" />
    </a>
        <span class="text-gray-300 text-sm">|</span>
        <a href="shop.html" class="text-[13px] text-[#171a20] font-medium">Shop</a>
      </div>

      <!-- Center: Nav links -->
      <div class="hidden md:flex items-center gap-8">
        <a href="charging.html" class="text-[13px] text-[#171a20] hover:text-gray-500 transition-colors">Charging</a>
        <a href="vehiclesacc.html" class="text-[13px] text-[#171a20] hover:text-gray-500 transition-colors">Vehicle Accessories</a>
        <a href="apparel.html" class="text-[13px] text-[#171a20] hover:text-gray-500 transition-colors">Apparel</a>
        <a href="lifestyle.html" class="text-[13px] text-[#171a20] hover:text-gray-500 transition-colors">Lifestyle</a>
        <a href="specialcollections.html" class="text-[13px] text-[#171a20] font-semibold hover:text-gray-500 transition-colors">Special Collections</a>
      </div>

      <!-- Right: Icons + Menu -->
      <div class="flex items-center gap-4">
        <button class="hover:text-gray-500 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </button>
        <button class="hover:text-gray-500 transition-colors relative">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.3 5.4a1 1 0 0 0 1 1.2h11.6M10 21a1 1 0 1 0 2 0 1 1 0 0 0-2 0zm7 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0z"/>
          </svg>
        </button>
        <button class="text-[13px] text-[#171a20] hover:text-gray-500 transition-colors font-medium">Menu</button>
      </div>
    </div>
  </nav>

  <!-- ═══════════════════ MAIN ═══════════════════ -->
  <main class="max-w-[1200px] mx-auto px-6 py-10">

    <!-- Page title -->
    <h1 class="text-[22px] font-bold text-[#171a20] mb-10">Special Collections</h1>

    <!-- ── TESLA FC ── -->
    <section class="mb-16">
      <h2 class="text-[15px] font-normal text-[#171a20] mb-6">Tesla FC</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">

        <!-- Jersey -->
        <div class="product-card cursor-pointer group">
          <div class="relative overflow-hidden bg-[#f2f2f2] rounded-sm aspect-[3/4] flex items-center justify-center">
            <img src="img2/special collections/2420009-00-A_1_2000.avif" alt="Tesla FC Jersey" class="product-img w-full h-full object-cover object-top" />
            <button class="wishlist-btn absolute top-3 right-3 p-1.5 bg-white rounded-full shadow-sm">
              <svg class="w-4 h-4 text-[#171a20]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 0 1 6.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 0 1 0-6.364z"/>
              </svg>
            </button>
          </div>
          <p class="text-[13px] font-semibold text-[#171a20] mt-3">Tesla FC Jersey</p>
          <p class="text-[13px] text-[#171a20] mt-0.5">$95</p>
        </div>

        <!-- Football -->
        <div class="product-card cursor-pointer group">
          <div class="relative overflow-hidden bg-[#f2f2f2] rounded-sm aspect-[3/4] flex items-center justify-center">
            <img src="img2/lifestyle/2420410-00-A_1_2000.webp" alt="Tesla FC Football" class="product-img w-2/3 h-2/3 object-contain" />
            <button class="wishlist-btn absolute top-3 right-3 p-1.5 bg-white rounded-full shadow-sm">
              <svg class="w-4 h-4 text-[#171a20]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 0 1 6.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 0 1 0-6.364z"/>
              </svg>
            </button>
          </div>
          <p class="text-[13px] font-semibold text-[#171a20] mt-3">Tesla FC Football</p>
          <p class="text-[13px] text-[#171a20] mt-0.5">$55</p>
        </div>

        <!-- Snapback Hat -->
        <div class="product-card cursor-pointer group">
          <div class="relative overflow-hidden bg-[#f2f2f2] rounded-sm aspect-[3/4] flex items-center justify-center">
            <img src="img2/special collections/2420014-00-A_01_2000.avif" alt="Tesla FC Snapback Hat" class="product-img w-2/3 h-2/3 object-contain" />
            <button class="wishlist-btn absolute top-3 right-3 p-1.5 bg-white rounded-full shadow-sm">
              <svg class="w-4 h-4 text-[#171a20]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 0 1 6.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 0 1 0-6.364z"/>
              </svg>
            </button>
          </div>
          <p class="text-[13px] font-semibold text-[#171a20] mt-3">Tesla FC Snapback Hat</p>
          <p class="text-[13px] text-[#171a20] mt-0.5">$35</p>
        </div>

        <!-- Socks -->
        <div class="product-card cursor-pointer group">
          <div class="relative overflow-hidden bg-[#f2f2f2] rounded-sm aspect-[3/4] flex items-center justify-center">
            <img src="img2/special collections/2420409-00-A_1_2000.avif" alt="Tesla FC Socks" class="product-img w-2/3 h-2/3 object-contain" />
            <button class="wishlist-btn absolute top-3 right-3 p-1.5 bg-white rounded-full shadow-sm">
              <svg class="w-4 h-4 text-[#171a20]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 0 1 6.364 0L12 7.636l1.318-1.318a4.5 4.5 0 0 1 6.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 0 1 0-6.364z"/>
              </svg>
            </button>
          </div>
          <p class="text-[13px] font-semibold text-[#171a20] mt-3">Tesla FC Socks</p>
          <p class="text-[13px] text-[#171a20] mt-0.5">$30</p>
        </div>

  </main>

  <!-- ═══════════════════ FOOTER ═══════════════════ -->
  <footer class="border-t border-gray-100 py-6 mt-10">
    <div class="max-w-[1200px] mx-auto px-6 flex flex-col sm:flex-row items-center justify-center gap-4 text-[12px] text-[#5c5e62]">
      <span>Tesla © 2026</span>
      <a href="#" class="hover:text-[#171a20] transition-colors">Privacy &amp; Legal</a>
      <a href="#" class="hover:text-[#171a20] transition-colors">Locations</a>
    </div>
  </footer>

</body>
</html>
